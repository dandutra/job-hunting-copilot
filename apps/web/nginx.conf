server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        # The trailing slash strips /api, so /api/x reaches the API as /x.
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
    }

    # The API health check is internal to Compose; the host must not expose it.
    location = /health {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
