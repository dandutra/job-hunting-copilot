name: Install Typst
description: Installs the Typst version in packages/resume-render/typst-version, checked against the SHA-256 in typst-linux-x64.sha256.
runs:
  using: composite
  steps:
    # The tests in packages/resume-render run the CLI. A version bump fails here until both files change.
    - shell: bash
      run: |
        v=$(cat packages/resume-render/typst-version)
        curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/typst.tar.xz" "https://github.com/typst/typst/releases/download/v${v}/typst-x86_64-unknown-linux-musl.tar.xz"
        echo "$(cat packages/resume-render/typst-linux-x64.sha256)  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
        mkdir "$RUNNER_TEMP/typst-bin"
        tar -xf "$RUNNER_TEMP/typst.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/typst-bin" typst-x86_64-unknown-linux-musl/typst
        echo "$RUNNER_TEMP/typst-bin" >> "$GITHUB_PATH"
        # GITHUB_PATH applies to later steps only, so call the binary by path here.
        "$RUNNER_TEMP/typst-bin/typst" --version
