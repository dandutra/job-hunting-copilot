name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A running main build is never interrupted; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic values for the throwaway service container below.
      DATABASE_URL: postgresql://ci:ci-password@localhost:5432/copilot
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the version from the packageManager field; Corepack is not used.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: node --version
      # scripts/backup.test.mjs needs age; Docker is already on the runner.
      - run: sudo apt-get install -y --no-install-recommends age
      - run: pnpm install --frozen-lockfile
      # Prisma 7 does not generate on install, and typecheck needs the client.
      - run: pnpm --dir apps/api exec prisma generate
      - run: pnpm check
      - run: pnpm --dir apps/api build

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic values; the stack lives only for this job.
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_PASSWORD: ci-smoke-password
      ALLOWED_TAILSCALE_LOGIN: ci-smoke@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images
        run: docker compose -f deploy/compose.prod.yaml build
      - name: No image holds personal data
        run: deploy/check-images-clean.sh
      - name: Exactly one published port, on 127.0.0.1
        run: |
          ports=$(docker compose -f deploy/compose.prod.yaml config --format json | jq -c '[.services[].ports // [] | .[] | [.host_ip, .published]]')
          echo "$ports"
          test "$ports" = '[["127.0.0.1","8080"]]'
      - name: Start the stack and wait for healthy
        run: docker compose -f deploy/compose.prod.yaml up -d --wait
      - name: Check migrate exit code
        run: test "$(docker inspect copilot-migrate-1 --format '{{.State.ExitCode}}')" = 0
      - name: UI and API answer through web
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/compose.prod.yaml logs --no-color --tail=100

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # No backend and no credentials: this checks syntax and provider schemas only.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
        env:
          TF_VAR_backups_bucket_name: ci-validate
          TF_VAR_alert_email: ci@example.invalid

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned because the runner image's shellcheck lags the one on the Mac and flags different lines.
      - run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          deploy/*.sh infra/*.sh
